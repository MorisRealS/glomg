<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L.O.M.G. | GUEST_ACCESS_PROTOCOL</title>
    <style>
        :root {
            --g: #00ff41;
            --dg: #003b00;
            --bg: #000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            background: var(--bg);
            color: var(--g);
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Эффект старого монитора */
        .crt-filter {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        #matrix {
            position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.15;
        }

        .terminal-box {
            position: relative;
            z-index: 10;
            width: 700px;
            height: 450px;
            border: 1px solid var(--g);
            background: rgba(0, 10, 0, 0.95);
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px var(--dg);
        }

        .header {
            text-align: center;
            font-size: 1.2em;
            letter-spacing: 8px;
            border-bottom: 1px solid var(--g);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        #log {
            flex-grow: 1;
            overflow: hidden;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .l { margin-bottom: 4px; opacity: 0; animation: f 0.1s forwards; }
        @keyframes f { to { opacity: 1; } }

        .progress-w {
            width: 100%;
            height: 4px;
            background: var(--dg);
            position: relative;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: var(--g);
            box-shadow: 0 0 10px var(--g);
        }

        .status {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .blink { animation: b 1s infinite; }
        @keyframes b { 50% { opacity: 0; } }

        /* Специальный префикс для строк */
        .p-ok { color: #fff; }
        .p-wrn { color: #ff3e3e; }
    </style>
</head>
<body>

    <div class="crt-filter"></div>
    <canvas id="matrix"></canvas>

    <div class="terminal-box">
        <div class="header">G.L.O.M.G. System Loader</div>
        
        <div id="log"></div>

        <div class="progress-w">
            <div id="bar"></div>
        </div>

        <div class="status">
            <span id="st">Initialization...</span>
            <span id="pct">0%</span>
        </div>
    </div>

    <script>
        const log = document.getElementById('log');
        const bar = document.getElementById('bar');
        const pct = document.getElementById('pct');
        const st = document.getElementById('st');

        // Matrix Rain Logic
        const c = document.getElementById('matrix');
        const x = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        const m = "01ABCDEFHIJKLMNOPQRSTUVWXYZ";
        const d = Array(Math.floor(c.width/16)).fill(1);

        function draw() {
            x.fillStyle = "rgba(0,0,0,0.05)";
            x.fillRect(0,0,c.width,c.height);
            x.fillStyle = "#0f0";
            d.forEach((y, i) => {
                const t = m[Math.floor(Math.random()*m.length)];
                x.fillText(t, i*16, y*16);
                if(y*16 > c.height && Math.random() > 0.975) d[i] = 0;
                d[i]++;
            });
        }
        setInterval(draw, 40);

        // Loading Script
        const tasks = [
            "Loading kernel modules...",
            "Searching for uplink node...",
            "Uplink found: 127.0.0.1:3000",
            "Establishing SSL handshake...",
            "Requesting temporary guest ID...",
            "ID allocated: GUEST_STATION_ALPHA",
            "Bypassing firewall [||||||||||] 100%",
            "Syncing with Supabase database...",
            "Loading interface 'mail.html'...",
            "Clearing local session cache...",
            "Ready for transmission."
        ];

        let cur = 0;
        let p = 0;

        function add(t) {
            const div = document.createElement('div');
            div.className = 'l';
            div.innerHTML = `<span style="color:#00ff41">></span> ${t}`;
            log.appendChild(div);
            if(log.childNodes.length > 12) log.removeChild(log.firstChild);
        }

        const run = setInterval(() => {
            p += Math.random() * 2.5;
            if (p >= 100) {
                p = 100;
                clearInterval(run);
                finish();
            }
            bar.style.width = p + "%";
            pct.innerText = Math.floor(p) + "%";

            if (Math.floor(p) % 9 === 0 && cur < tasks.length) {
                add(tasks[cur]);
                cur++;
            }
        }, 60);

        function finish() {
            st.innerHTML = "<span class='blink'>ACCESS GRANTED. REDIRECTING...</span>";
            
            if (!localStorage.getItem('username')) {
                localStorage.setItem('username', 'Guest_' + Math.floor(Math.random()*9999));
            }

            setTimeout(() => {
                window.location.href = '/mail';
            }, 1200);
        }

        window.addEventListener('resize', () => {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
        });
    </script>
</body>
</html>
