<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L.O.M.G. | GUEST_ACCESS</title>
    <style>
        body, html {
            background-color: #000;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        .terminal-container {
            position: relative;
            z-index: 10;
            width: 80%;
            max-width: 800px;
            background: rgba(0, 5, 0, 0.9);
            border: 1px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 20px #00ff4144;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .log-area {
            height: 300px;
            overflow-y: hidden;
            font-size: 14px;
            line-height: 1.5;
        }

        .log-line {
            margin-bottom: 5px;
            opacity: 0;
            transform: translateX(-10px);
            animation: fadeInLine 0.1s forwards;
        }

        @keyframes fadeInLine {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background-color: #00ff41;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .progress-container {
            margin-top: 20px;
            border: 1px solid #00ff41;
            height: 20px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00ff41;
            transition: width 0.1s;
        }

        .percent-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            mix-blend-mode: difference;
        }

        .warning {
            color: #ff3e3e;
            font-weight: bold;
        }

        .success {
            color: #fff;
            text-shadow: 0 0 5px #00ff41;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="terminal-container">
        <div class="header">--- G.L.O.M.G. SYSTEM OVERRIDE ---</div>
        <div class="log-area" id="log">
            <div class="log-line">> INITIATING GUEST PROTOCOL...</div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="bar"></div>
            <div class="percent-text" id="percent">0%</div>
        </div>
    </div>

    <script>
        // --- MATRIX RAIN EFFECT ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px arial";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // --- TERMINAL LOGIC ---
        const logArea = document.getElementById('log');
        const bar = document.getElementById('bar');
        const percentText = document.getElementById('percent');

        const phrases = [
            "> Requesting anonymous access...",
            "> Bypassing security layers...",
            "> [WARNING] Firewall detected. Rotatining proxies...",
            "> Proxy 127.0.8.1:8080 - CONNECTED",
            "> Injecting guest_token_v2.0.4...",
            "> Decrypting satellite relay...",
            "> Connection established via Node_77",
            "> System: Identifying user...",
            "> Status: GUEST_MODE_ACTIVE",
            "> Allocating temporary memory...",
            "> Clearing session traces...",
            "> Preparing mail interface...",
            "> READY. Redirecting to core..."
        ];

        let currentLine = 0;
        let progress = 0;

        function addLogLine(text) {
            const line = document.createElement('div');
            line.className = 'log-line';
            if (text.includes('WARNING')) line.classList.add('warning');
            if (text.includes('READY')) line.classList.add('success');
            line.innerHTML = text;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function updateLoading() {
            if (progress < 100) {
                progress += Math.random() * 2;
                if (progress > 100) progress = 100;
                bar.style.width = progress + '%';
                percentText.innerText = Math.floor(progress) + '%';

                if (Math.floor(progress) % 8 === 0 && currentLine < phrases.length) {
                    addLogLine(phrases[currentLine]);
                    currentLine++;
                }
                
                requestAnimationFrame(updateLoading);
            } else {
                completeAccess();
            }
        }

        function completeAccess() {
            addLogLine("> ACCESS GRANTED.");
            
            // Сохраняем гостя
            if (!localStorage.getItem('username')) {
                const gId = 'Guest_' + Math.floor(Math.random() * 1000);
                localStorage.setItem('username', gId);
            }

            setTimeout(() => {
                window.location.href = '/mail';
            }, 1500);
        }

        // Запуск через небольшую задержку
        setTimeout(updateLoading, 500);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
