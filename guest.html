<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L.O.M.G. | GUEST_ACCESS_PROTOCOL</title>
    <style>
        /* G.L.O.M.G. CORE UI STYLESHEET 
           VERSION: 4.5.1
        */
        :root {
            --neon-green: #00ff41;
            --dark-green: #003b00;
            --bg-black: #000000;
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: var(--bg-black);
            color: var(--neon-green);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .terminal-container {
            width: 750px;
            height: 480px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 5, 0, 0.95);
            padding: 35px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.15);
            position: relative;
            z-index: 10;
        }

        .terminal-header {
            text-align: center;
            border-bottom: 2px double var(--neon-green);
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 900;
            font-size: 1.3em;
        }

        #output-console {
            flex-grow: 1;
            overflow-y: hidden;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
            border-left: 1px solid var(--dark-green);
            padding-left: 15px;
        }

        .log-line {
            margin-bottom: 4px;
            opacity: 0;
            transform: translateX(-10px);
            animation: lineFadeIn 0.15s forwards ease-out;
        }

        @keyframes lineFadeIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .progress-wrapper {
            width: 100%;
            height: 6px;
            background: var(--dark-green);
            position: relative;
            margin-bottom: 15px;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: var(--neon-green);
            box-shadow: 0 0 12px var(--neon-green);
            transition: width 0.12s linear;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-green);
        }

        .blink-text {
            animation: terminalBlink 1s infinite;
        }

        @keyframes terminalBlink {
            50% { opacity: 0; }
        }

        .system-ok { color: #ffffff; text-shadow: 0 0 5px var(--neon-green); }
        .system-warn { color: #ff3e3e; }

        /* Изоляция от внешних стилей */
        #bongo-cat-container { pointer-events: none; }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="terminal-header">G.L.O.M.G. Access Override</div>
        
        <div id="output-console">
            </div>

        <div class="progress-wrapper">
            <div id="progress-bar"></div>
        </div>

        <div class="status-bar">
            <span id="current-action">Initializing system...</span>
            <span id="percent-val">0%</span>
        </div>
    </div>

    <script>
        const consoleLog = document.getElementById('output-console');
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent-val');
        const actionText = document.getElementById('current-action');

        const initializationSteps = [
            "Booting kernel modules v4.5...",
            "Establishing handshake with Master Node...",
            "Requesting temporary guest credentials...",
            "Allocating secure buffer for Socket.io...",
            "Routing through encrypted relay 127.0.0.1...",
            "Bypassing standard authentication layers...",
            "Verifying Supabase synchronization...",
            "Injection of session headers: [COMPLETE]",
            "Setting up real-time mail listener...",
            "Finalizing terminal environment...",
            "Clearing local cache artifacts...",
            "Handshake verified. Access granted."
        ];

        let stepIndex = 0;
        let globalProgress = 0;

        function appendLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-line';
            if (msg.includes("[COMPLETE]") || msg.includes("granted")) {
                entry.classList.add('system-ok');
            }
            entry.innerHTML = `<span style="color:var(--neon-green)">[SYS_MSG]</span> ${msg}`;
            consoleLog.appendChild(entry);

            if (consoleLog.childNodes.length > 14) {
                consoleLog.removeChild(consoleLog.firstChild);
            }
        }

        const loadSequence = setInterval(() => {
            // Имитация переменной скорости загрузки
            globalProgress += Math.random() * 2.2;
            
            if (globalProgress >= 100) {
                globalProgress = 100;
                clearInterval(loadSequence);
                finalizeAuth();
            }

            progressBar.style.width = globalProgress + "%";
            percentText.innerText = Math.floor(globalProgress) + "%";

            // Вывод строк лога при достижении порогов
            if (Math.floor(globalProgress) % 8 === 0 && stepIndex < initializationSteps.length) {
                appendLog(initializationSteps[stepIndex]);
                actionText.innerText = "Task: " + initializationSteps[stepIndex].substring(0, 25) + "...";
                stepIndex++;
            }
        }, 75);

        function finalizeAuth() {
            actionText.innerHTML = "<span class='blink-text system-ok'>CONNECTION ESTABLISHED. REDIRECTING...</span>";
            
            // Проверка и создание ника
            if (!localStorage.getItem('username')) {
                const guestID = "GUEST_" + Math.floor(1000 + Math.random() * 8999);
                localStorage.setItem('username', guestID);
            }

            setTimeout(() => {
                window.location.href = '/mail';
            }, 1400);
        }

        // Первый импульс системы
        setTimeout(() => appendLog("G.L.O.M.G. Guest Interface v1.0.4 - Initialized."), 250);
    </script>
</body>
</html>
