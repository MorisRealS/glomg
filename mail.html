<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L.O.M.G. | CORE_ACCESS_TERMINAL</title>
    <style>
        /* --- ТЕРМИНАЛЬНЫЕ СТИЛИ --- 
        */
        :root {
            --green: #00ff41;
            --dark-green: #003b00;
            --deep-bg: #050505;
            --scanline-color: rgba(0, 255, 65, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            background-color: var(--deep-bg);
            color: var(--green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            text-shadow: 0 0 5px var(--green);
        }

        /* Эффект старого монитора (CRT) */
        .crt-filter {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .scanline-anim {
            width: 100%;
            height: 100px;
            z-index: 1000;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, var(--scanline-color) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanlineMove 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scanlineMove {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }

        #matrix-bg {
            position: fixed;
            top: 0; left: 0;
            z-index: 0;
            opacity: 0.25;
        }

        /* Контейнер интерфейса */
        .ui-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 25px;
            background: rgba(0, 8, 0, 0.88);
            border: 1px solid var(--green);
            margin: 15px;
            box-shadow: inset 0 0 30px rgba(0, 255, 65, 0.1), 0 0 15px rgba(0, 255, 65, 0.2);
        }

        .top-info-panel {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px double var(--green);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #terminal-content {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--green) #000;
        }

        /* Стилизация скроллбара */
        #terminal-content::-webkit-scrollbar { width: 8px; }
        #terminal-content::-webkit-scrollbar-track { background: #000; }
        #terminal-content::-webkit-scrollbar-thumb { background: var(--green); border: 2px solid #000; }

        .line-wrap { margin-bottom: 12px; line-height: 1.4; animation: blinkIn 0.05s ease; }
        @keyframes blinkIn { from { opacity: 0; } to { opacity: 1; } }

        .prefix-sys { color: #fff; background: var(--dark-green); padding: 0 5px; margin-right: 8px; font-size: 12px; }
        .prefix-mail { color: #000; background: var(--green); padding: 0 5px; margin-right: 8px; font-size: 12px; font-weight: bold; }
        .prefix-err { color: #fff; background: #900; padding: 0 5px; margin-right: 8px; font-size: 12px; }
        
        .time-stamp { color: #008f11; font-size: 0.85em; margin-right: 10px; }
        .user-tag { color: #fff; text-shadow: 0 0 10px var(--green); }

        .command-input-container {
            display: flex;
            align-items: center;
            border-top: 1px solid var(--green);
            padding-top: 15px;
            margin-top: 10px;
        }

        .terminal-prompt {
            color: var(--green);
            font-weight: bold;
            margin-right: 12px;
            white-space: nowrap;
        }

        #cli-input {
            background: transparent;
            border: none;
            color: var(--green);
            font-family: inherit;
            font-size: 18px;
            width: 100%;
            outline: none;
            caret-color: #fff;
        }

        .action-bar {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .terminal-btn {
            background: transparent;
            border: 1px solid var(--green);
            color: var(--green);
            padding: 8px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            font-family: inherit;
            transition: 0.2s;
        }

        .terminal-btn:hover {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 15px var(--green);
        }

        .blink { animation: fastBlink 1s infinite; }
        @keyframes fastBlink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="crt-filter"></div>
    <div class="scanline-anim"></div>
    <canvas id="matrix-bg"></canvas>

    <div class="ui-wrapper">
        <div class="top-info-panel">
            <div id="sys-name">G.L.O.M.G. NETWORK v4.5.1</div>
            <div id="sys-clock">00:00:00</div>
            <div id="sys-user">ID: ---</div>
        </div>

        <div id="terminal-content">
            </div>

        <div class="command-input-container">
            <span class="terminal-prompt" id="prompt-text">user@glomg:~$</span>
            <input type="text" id="cli-input" autofocus spellcheck="false" autocomplete="off">
        </div>

        <div class="action-bar">
            <button class="terminal-btn" onclick="location.href='/send_mail'">[F1] TRANSMIT_DATA</button>
            <button class="terminal-btn" onclick="clearConsole()">[F2] CLEAR_BUFFER</button>
            <button class="terminal-btn" onclick="location.href='/dashboard'">[F3] DASHBOARD</button>
            <button class="terminal-btn" onclick="location.href='/'">[F4] TERMINATE</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        /**
         * INITIALIZATION & VARIABLES
         */
        const terminal = document.getElementById('terminal-content');
        const inputField = document.getElementById('cli-input');
        const clockDisplay = document.getElementById('sys-clock');
        const promptLabel = document.getElementById('prompt-text');
        const userDisplay = document.getElementById('sys-user');
        
        const socket = io();
        const userName = localStorage.getItem('username') || 'Guest_' + Math.floor(Math.random() * 9999);

        // Update UI
        userDisplay.innerText = "ID: " + userName.toUpperCase();
        promptLabel.innerText = userName.toLowerCase() + "@glomg:~$";

        /**
         * MATRIX BACKGROUND ENGINE
         */
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>?";
        const fontSize = 16;
        const columns = Math.floor(width / fontSize);
        const rainDrops = Array(columns).fill(1);

        function renderMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(renderMatrix, 35);

        /**
         * TERMINAL CORE FUNCTIONS
         */
        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ":" + 
                   now.getMinutes().toString().padStart(2, '0') + ":" + 
                   now.getSeconds().toString().padStart(2, '0');
        }

        function updateClock() {
            clockDisplay.innerText = getCurrentTime();
        }
        setInterval(updateClock, 1000);

        function writeToTerminal(text, type = 'default') {
            const line = document.createElement('div');
            line.className = 'line-wrap';
            
            const timeSpan = `<span class="time-stamp">[${getCurrentTime()}]</span>`;
            let prefix = "";

            switch(type) {
                case 'sys': prefix = `<span class="prefix-sys">CORE</span> `; break;
                case 'mail': prefix = `<span class="prefix-mail">MAIL</span> `; break;
                case 'error': prefix = `<span class="prefix-err">ERR!</span> `; break;
                default: prefix = `<span style="color:var(--green)">></span> `;
            }

            line.innerHTML = `${timeSpan} ${prefix} ${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearConsole() {
            terminal.innerHTML = "";
            writeToTerminal("Console buffer reset. System ready.", "sys");
        }

        /**
         * SOCKET.IO & EVENTS
         */
        socket.emit('auth', userName);

        socket.on('connect', () => {
            writeToTerminal("Socket established with central node.", "sys");
        });

        socket.on('new_mail', (data) => {
            writeToTerminal(`INBOUND FROM <span class="user-tag">${data.from}</span>: ${data.text}`, "mail");
            const alertSfx = new Audio('https://www.soundjay.com/buttons/beep-07a.mp3');
            alertSfx.volume = 0.3;
            alertSfx.play().catch(() => {});
        });

        /**
         * COMMAND PROCESSOR
         */
        inputField.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const cmd = this.value.trim();
                if (cmd === "") return;

                writeToTerminal(`<span style="color:#fff">${cmd}</span>`);
                const command = cmd.toLowerCase();

                // Расширенная логика команд
                if (command === 'help') {
                    writeToTerminal("Available commands: status, clear, whoami, info, mail, reboot");
                } else if (command === 'status') {
                    writeToTerminal("CPU: 12% | MEMORY: 442MB/1024MB | LINK: SECURE", "sys");
                } else if (command === 'whoami') {
                    writeToTerminal(`USER: ${userName} | PRIVILEGES: LEVEL_1_ACCESS`, "sys");
                } else if (command === 'clear') {
                    clearConsole();
                } else if (command === 'mail') {
                    location.href = '/send_mail';
                } else if (command === 'reboot') {
                    writeToTerminal("System rebooting...", "error");
                    setTimeout(() => location.reload(), 1500);
                } else if (command === 'about') {
                    writeToTerminal("G.L.O.M.G. Core. Created for decentralized encrypted communication.", "sys");
                } else {
                    writeToTerminal(`Unknown command: '${command}'. Type 'help' for manual.`, "error");
                }

                this.value = "";
            }
        });

        // ПРИВЕТСТВЕННАЯ ЗАГРУЗКА
        setTimeout(() => writeToTerminal("Booting G.L.O.M.G. OS...", "sys"), 400);
        setTimeout(() => writeToTerminal("Scanning for unread packets in Supabase...", "sys"), 900);
        setTimeout(() => writeToTerminal("User authenticated as " + userName, "sys"), 1400);
        setTimeout(() => writeToTerminal("Welcome to the decentralized relay. Type 'help' for commands.", "sys"), 2000);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
