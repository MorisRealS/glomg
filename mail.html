<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>G.L.O.M.G. | INTERNAL_MAIL</title>
    <style>
        :root { --purple: #a020f0; --bg: #050005; --dark-p: #1a002a; }
        body { margin: 0; background: var(--bg); color: var(--purple); font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { height: 50px; border-bottom: 2px solid var(--purple); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        
        .send-btn { background: var(--purple); color: #fff; border: none; padding: 10px 15px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        
        .mail-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Левая панель списка */
        .mail-list { width: 300px; border-right: 1px solid var(--purple); overflow-y: auto; background: var(--dark-p); }
        .mail-item { padding: 15px; border-bottom: 1px solid rgba(160, 32, 240, 0.3); cursor: pointer; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mail-item:hover { background: rgba(160, 32, 240, 0.2); }
        .mail-item.active { background: var(--purple); color: #fff; }

        /* Правая панель контента */
        .mail-view { flex: 1; padding: 40px; overflow-y: auto; }
        .view-header { border-bottom: 1px solid var(--purple); margin-bottom: 20px; padding-bottom: 20px; }
        .view-subject { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .view-sender { font-size: 14px; opacity: 0.8; }
        .view-body { line-height: 1.6; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="user-info">UUID: 0000000000 | LVL: 0</div>
        <button class="send-btn" onclick="location.href='/send_mail.html'">Отправить сообщение</button>
    </div>

    <div class="mail-wrapper">
        <div class="mail-list" id="list">
            </div>
        <div class="mail-view" id="viewer">
            <div id="empty-hint">Выберите сообщение для просмотра</div>
        </div>
    </div>

    <script>
        // Эмуляция данных (в реальности придет от сервера/сокетов)
        const messages = [
            { id: 1, subject: "Системное сообщение", from: "SYS_CORE", body: "Ваш уровень доступа подтвержден. Добро пожаловать." },
            { id: 2, subject: "Протоколы безопасности", from: "MORISREAL", body: "Всем сотрудникам обновить UUID ключи до конца смены." }
        ];

        function formatTitle(text) {
            // Правило: 11 без пробела, 12 с пробелом
            const limit = text.includes(' ') ? 12 : 11;
            if (text.length > limit) return text.substring(0, limit) + "...";
            return text;
        }

        const listContainer = document.getElementById('list');
        const viewer = document.getElementById('viewer');

        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'mail-item';
            div.innerText = formatTitle(msg.subject);
            div.onclick = () => {
                document.querySelectorAll('.mail-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                renderMessage(msg);
            };
            listContainer.appendChild(div);
        });

        function renderMessage(msg) {
            viewer.innerHTML = `
                <div class="view-header">
                    <div class="view-subject">${msg.subject}</div>
                    <div class="view-sender">Отправитель: ${msg.from}</div>
                </div>
                <div class="view-body">${msg.body}</div>
            `;
        }

        // Логика уровней и UUID
        const userData = {
            name: localStorage.getItem('username') || 'Guest',
            uuid: "0110110110", // Пример двоичного UUID
            lvl: 4
        };
        
        // Маппинг уровней
        if(userData.name === 'morisreal') userData.lvl = 6;
        else if(userData.name === 'sumber') userData.lvl = 5;
        
        document.getElementById('user-info').innerText = `UUID: ${userData.uuid} | LVL: ${userData.lvl}`;
    </script>
</body>
</html>
