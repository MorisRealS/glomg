<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>G.L.O.M.G. | SECURE_STATION_TERMINAL_PRO_V9</title>
    <style>
        /* --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ЦВЕТА --- */
        :root {
            --neon-purple: #a020f0;
            --deep-purple: #1a002a;
            --ultra-black: #050005;
            --glow-color: rgba(160, 32, 240, 0.4);
            --sidebar-width: 380px;
            --header-height: 75px;
            --vhs-scan-speed: 8s;
            --crt-opacity: 0.15;
        }

        /* --- БАЗОВЫЙ СКЕЛЕТ И VHS ENGINE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--ultra-black);
            color: var(--neon-purple);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Эффект шума VHS */
        body::before {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_30fps_static_noise.gif');
            opacity: 0.03;
            z-index: 9999;
            pointer-events: none;
        }

        /* Полосы сканирования CRT */
        body::after {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.2) 50%
            ), linear-gradient(
                90deg, 
                rgba(255, 0, 0, 0.05), 
                rgba(0, 255, 0, 0.02), 
                rgba(0, 0, 255, 0.05)
            );
            background-size: 100% 3px, 3px 100%;
            z-index: 9998;
            pointer-events: none;
        }

        /* Бегущая VHS линия */
        .vhs-scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(160, 32, 240, 0.2);
            opacity: 0.6;
            z-index: 10000;
            pointer-events: none;
            animation: moveScanline var(--vhs-scan-speed) linear infinite;
            box-shadow: 0 0 15px var(--neon-purple);
        }

        @keyframes moveScanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Фоновая геометрия платы */
        .background-pcb {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(160, 32, 240, 0.15) 0%, transparent 80%),
                linear-gradient(rgba(160, 32, 240, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(160, 32, 240, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 55px 55px, 55px 55px;
        }

        /* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
        .main-header {
            height: var(--header-height);
            border-bottom: 2px solid var(--neon-purple);
            background-color: rgba(5, 0, 10, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }

        .header-logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-purple);
        }

        .nav-group {
            display: flex;
            gap: 25px;
        }

        .btn-ui {
            background: transparent;
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
            padding: 10px 24px;
            font-family: inherit;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-ui:hover {
            background-color: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-purple);
            transform: scale(1.05);
        }

        /* --- РАБОЧЕЕ ПРОСТРАНСТВО --- */
        .workspace {
            display: flex;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }

        /* ЛЕВАЯ ПАНЕЛЬ: РАЗМЫТА ВСЕГДА */
        .sidebar {
            width: var(--sidebar-width);
            border-right: 1px solid var(--neon-purple);
            background-color: rgba(15, 0, 25, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        .tabs-header {
            display: flex;
            border-bottom: 1px solid var(--neon-purple);
        }

        .tab-item {
            flex: 1;
            padding: 18px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.5;
            border-right: 1px solid var(--neon-purple);
        }

        .tab-item:last-child { border-right: none; }
        .tab-item.active {
            opacity: 1;
            background-color: rgba(160, 32, 240, 0.2);
            text-shadow: 0 0 5px #fff;
        }

        .data-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-purple) transparent;
        }

        .data-node {
            padding: 25px 30px;
            border-bottom: 1px solid rgba(160, 32, 240, 0.1);
            transition: 0.4s;
            position: relative;
        }

        .data-node:hover {
            background-color: rgba(160, 32, 240, 0.1);
        }

        .data-node.is-active {
            background-color: rgba(40, 0, 70, 0.9);
            border-left: 6px solid var(--neon-purple);
            color: #fff;
        }

        /* ПРАВАЯ ПАНЕЛЬ: РАЗМЫТИЕ ПРИ ЧТЕНИИ */
        .content-viewer {
            flex: 1;
            padding: 80px;
            position: relative;
            transition: 0.8s ease-in-out;
            display: flex;
            justify-content: center;
        }

        .content-viewer.is-blurred {
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            background-color: rgba(5, 0, 5, 0.7);
        }

        .inner-content {
            width: 100%;
            max-width: 900px;
            opacity: 0;
            transform: translateY(30px);
            transition: 0.5s;
        }

        .inner-content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .msg-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--neon-purple);
            padding-bottom: 20px;
            text-transform: uppercase;
        }

        .msg-meta {
            font-size: 13px;
            opacity: 0.6;
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        .msg-body {
            font-size: 19px;
            line-height: 1.9;
            color: rgba(255, 255, 255, 0.9);
            white-space: pre-wrap;
        }

        /* --- СКРОЛЛБАР --- */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-purple); }

    </style>
</head>
<body>

    <div class="vhs-scanline"></div>
    <div class="background-pcb"></div>

    <header class="main-header">
        <div class="header-logo">G.L.O.M.G. TERMINAL</div>
        <div class="nav-group">
            <a href="dashboard.html" class="btn-ui">ПРОФИЛЬ</a>
            <a href="send_mail.html" class="btn-ui" id="btn-write">НАПИСАТЬ</a>
        </div>
        <div id="uuid-display" style="font-weight: bold; font-size: 14px; opacity: 0.8;">UUID: NULL_DATA</div>
    </header>

    <section class="workspace">
        <aside class="sidebar">
            <div class="tabs-header">
                <div class="tab-item active" id="tab-inbox" onclick="toggleLayer('inbox')">MESSAGES</div>
                <div class="tab-item" id="tab-archive" onclick="toggleLayer('archive')">ARCHIVE</div>
            </div>
            <div class="data-list" id="list-container">
                </div>
        </aside>

        <main class="content-viewer" id="viewer-pane">
            <div class="inner-content" id="content-root">
                </div>
        </main>
    </section>

    <script>
        /* ================================================================
           ЛОГИКА ТЕРМИНАЛА
           ================================================================ */

        const database = {
            inbox: [
                { id: 1, sender: "SYSTEM_CORE", title: "Доступ разрешен", body: "Ваша авторизация в системе G.L.O.M.G. прошла успешно. Все протоколы VHS и CRT синхронизированы с вашим UUID." },
                { id: 2, sender: "MORISREAL", title: "Координаты сектора", body: "Проверь зашифрованный канал в Telegram. Я скинул новые спецификации для 10-битных ключей." },
                { id: 3, sender: "SUMBER", title: "Тест полосы", body: "Если ты видишь бегущую полосу, значит VHS-движок работает корректно. Конец связи." }
            ],
            archive: [
                { id: 101, sender: "SEC_ARCHIVE", title: "Лог_1998_04", body: "Первое упоминание о MorisReal в логах системы. Проект 'Плата' запущен в производство." },
                { id: 102, sender: "G.L.O.M.G.", title: "Чертеж_V1", body: "Интерфейс должен быть фиолетовым. Любое использование зеленого цвета карается блокировкой UUID." },
                { id: 103, sender: "SYSTEM", title: "Final_Warn", body: "Попытка несанкционированного доступа к TG_BOT_API будет пресечена." }
            ]
        };

        let currentLayer = 'inbox';
        let activeMessageId = null;

        const listRoot = document.getElementById('list-container');
        const viewer = document.getElementById('viewer-pane');
        const content = document.getElementById('content-root');

        /**
         * Умная обрезка текста 11/12
         */
        function getPrettyTitle(str) {
            const hasSpace = str.indexOf(' ') !== -1 || str.indexOf('_') !== -1;
            const limit = hasSpace ? 12 : 11;
            return str.length > limit ? str.substring(0, limit) + ".." : str;
        }

        /**
         * Переключение вкладок
         */
        function toggleLayer(layer) {
            currentLayer = layer;
            activeMessageId = null;
            
            document.getElementById('tab-inbox').classList.toggle('active', layer === 'inbox');
            document.getElementById('tab-archive').classList.toggle('active', layer === 'archive');
            document.getElementById('btn-write').style.display = layer === 'inbox' ? 'block' : 'none';
            
            viewer.classList.remove('is-blurred');
            content.classList.remove('visible');
            
            render();
        }

        /**
         * Отрисовка списка
         */
        function render() {
            listRoot.innerHTML = '';
            const items = database[currentLayer];

            items.forEach(item => {
                const node = document.createElement('div');
                node.className = `data-node ${activeMessageId === item.id ? 'is-active' : ''}`;
                node.innerText = getPrettyTitle(item.title);
                
                node.onclick = () => {
                    if (activeMessageId === item.id) {
                        activeMessageId = null;
                        viewer.classList.remove('is-blurred');
                        content.classList.remove('visible');
                    } else {
                        activeMessageId = item.id;
                        openMsg(item);
                    }
                    render();
                };
                listRoot.appendChild(node);
            });
        }

        /**
         * Открытие сообщения
         */
        function openMsg(msg) {
            viewer.classList.add('is-blurred');
            content.classList.add('visible');
            content.innerHTML = `
                <h1 class="msg-title">${msg.title}</h1>
                <div class="msg-meta">ОТПРАВИТЕЛЬ: ${msg.sender} | LAYER: ${currentLayer.toUpperCase()}</div>
                <div class="msg-body">${msg.body}</div>
            `;
        }

        // Инициализация профиля
        const realName = localStorage.getItem('username') || 'MORISREAL';
        const realUUID = localStorage.getItem('user_uuid') || '1110001110';
        document.getElementById('uuid-display').innerText = `ID: ${realUUID}`;

        render();
    </script>
</body>
</html>
