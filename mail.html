<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>G.L.O.M.G. | Internal Mail</title>
    <style>
        :root { --purple: #a020f0; --bg: #050005; --panel: #11001a; }
        body { margin: 0; background: var(--bg); color: var(--purple); font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Шапка */
        .header { height: 70px; border-bottom: 2px solid var(--purple); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .send-link { background: var(--purple); color: #fff; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 2px; }

        /* Контент */
        .mail-body { display: flex; flex: 1; overflow: hidden; }

        /* Левая панель (Список) */
        .side-list { width: 320px; border-right: 1px solid var(--purple); background: var(--panel); overflow-y: auto; }
        .mail-preview {
            padding: 20px; border-bottom: 1px solid rgba(160, 32, 240, 0.2); cursor: pointer;
            transition: 0.2s; white-space: nowrap;
        }
        .mail-preview:hover { background: rgba(160, 32, 240, 0.1); }
        .mail-preview.active { border-left: 5px solid var(--purple); background: rgba(160, 32, 240, 0.15); }

        /* Правая панель (Просмотр) */
        .view-pane { flex: 1; padding: 50px; overflow-y: auto; }
        .info-block { margin-bottom: 30px; border-bottom: 1px solid var(--purple); padding-bottom: 20px; }
        .subj { font-size: 28px; margin-bottom: 10px; }
        .from { opacity: 0.7; font-size: 14px; }
        .text { line-height: 1.8; font-size: 16px; }

        .uuid-tag { font-size: 12px; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="header">
        <div class="uuid-tag" id="profile-info">UUID: 0000000000 | LVL: 0</div>
        <a href="/send_mail" class="send-link">ОТПРАВИТЬ СООБЩЕНИЕ</a>
    </div>

    <div class="mail-body">
        <div class="side-list" id="mail-list">
            </div>
        <div class="view-pane" id="mail-view">
            <div style="opacity:0.3; text-align:center; margin-top:100px;">ВЫБЕРИТЕ ПАКЕТ ДАННЫХ ДЛЯ ДЕШИФРОВКИ</div>
        </div>
    </div>

    <script>
        // Имитация данных (замени на свои из БД/Сокетов)
        const mockMails = [
            { id: 1, subject: "Системное сообщение", from: "CORE", body: "Доступ к терминалу разрешен. Протоколы синхронизированы." },
            { id: 2, subject: "Протоколы безопасности", from: "MORISREAL", body: "Проверьте свои UUID на соответствие реестру." },
            { id: 3, subject: "Отчет по работе", from: "SUMBER", body: "Все системы работают в штатном режиме." }
        ];

        function formatSubject(text) {
            // 11 без пробела, 12 с пробелом
            const hasSpace = text.includes(' ');
            const limit = hasSpace ? 12 : 11;
            return text.length > limit ? text.substring(0, limit) + "..." : text;
        }

        const list = document.getElementById('mail-list');
        const view = document.getElementById('mail-view');

        mockMails.forEach(m => {
            const div = document.createElement('div');
            div.className = 'mail-preview';
            div.innerText = formatSubject(m.subject);
            div.onclick = () => {
                document.querySelectorAll('.mail-preview').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                view.innerHTML = `
                    <div class="info-block">
                        <div class="subj">${m.subject}</div>
                        <div class="from">ОТПРАВИТЕЛЬ: ${m.from}</div>
                    </div>
                    <div class="text">${m.body}</div>
                `;
            };
            list.appendChild(div);
        });

        // Данные сотрудника
        const user = localStorage.getItem('username') || 'Guest';
        let lvl = 0; let uuid = "0000000000";

        if(user === 'morisreal') { lvl = 6; uuid = "1011100101"; }
        else if(user === 'sumber') { lvl = 5; uuid = "0011101010"; }
        else { lvl = 4; uuid = "0010111010"; }

        document.getElementById('profile-info').innerText = `UUID: ${uuid} | LVL: ${lvl}`;
    </script>
</body>
</html>
