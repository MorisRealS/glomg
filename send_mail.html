<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L.O.M.G. | SECURE_TRANSMISSION_TERMINAL_V5</title>
    <style>
        /* ================================================================
           ЦВЕТОВАЯ ПАЛИТРА И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
           ================================================================
        */
        :root {
            --p-neon: #a020f0;
            --p-glow: rgba(160, 32, 240, 0.45);
            --p-dim: rgba(160, 32, 240, 0.12);
            --p-dark: rgba(25, 0, 45, 0.85);
            --bg-deep: #050005;
            --glass-sidebar: rgba(10, 0, 20, 0.55);
            --glass-form: rgba(20, 0, 40, 0.4);
            --text-main: #a020f0;
            --text-bright: #ffffff;
            --transition-main: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ================================================================
           БАЗОВЫЕ НАСТРОЙКИ И ОБНУЛЕНИЕ
           ================================================================
        */
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================================================================
           ФОНОВАЯ ПОДЛОЖКА: ПЛАТА + ЦЕНТРАЛЬНЫЙ СВЕТ
           ================================================================
        */
        .system-background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(160, 32, 240, 0.2) 0%, transparent 80%),
                linear-gradient(var(--p-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--p-dim) 1px, transparent 1px);
            background-size: 100% 100%, 65px 65px, 65px 65px;
            pointer-events: none;
        }

        /* ================================================================
           ВЕРХНЯЯ НАВИГАЦИОННАЯ ПАНЕЛЬ (HEADER)
           ================================================================
        */
        .header-interface {
            height: 70px;
            width: 100%;
            border-bottom: 2px solid var(--p-neon);
            background-color: rgba(5, 0, 10, 0.96);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 40px;
            z-index: 100;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9);
        }

        .nav-back-unit a {
            color: var(--p-neon);
            text-decoration: none;
            border: 1px solid var(--p-neon);
            padding: 10px 25px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition-main);
            position: relative;
            overflow: hidden;
        }

        .nav-back-unit a:hover {
            background-color: var(--p-neon);
            color: var(--text-bright);
            box-shadow: 0 0 20px var(--p-neon);
        }

        /* ================================================================
           ОСНОВНОЙ КОНТЕЙНЕР (LAYOUT)
           ================================================================
        */
        .main-transmission-layout {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 70px);
            overflow: hidden;
        }

        /* ================================================================
           ЛЕВАЯ ПАНЕЛЬ: БАЗА КОНТАКТОВ (SIDEBAR)
           ================================================================
        */
        .contacts-module {
            width: 380px;
            height: 100%;
            border-right: 1px solid var(--p-neon);
            background-color: var(--glass-sidebar);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .module-header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid var(--p-neon);
            background: rgba(160, 32, 240, 0.05);
        }

        .module-header h3 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--p-neon);
        }

        .contacts-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .contacts-scroll-area::-webkit-scrollbar { width: 5px; }
        .contacts-scroll-area::-webkit-scrollbar-thumb { background: var(--p-neon); }

        .contact-card {
            padding: 22px 30px;
            border-bottom: 1px solid rgba(160, 32, 240, 0.08);
            cursor: pointer;
            transition: var(--transition-main);
            position: relative;
        }

        .contact-card:hover {
            background-color: rgba(160, 32, 240, 0.1);
            padding-left: 40px;
        }

        .contact-card .username {
            display: block;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-bright);
        }

        .contact-card .user-uuid {
            display: block;
            font-size: 12px;
            opacity: 0.6;
            letter-spacing: 1.5px;
        }

        .contact-card .access-level {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            border: 1px solid var(--p-neon);
            padding: 2px 6px;
        }

        /* ================================================================
           ЦЕНТРАЛЬНАЯ ЧАСТЬ: ФОРМА ОТПРАВКИ
           ================================================================
        */
        .composition-module {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            position: relative;
        }

        .glass-form-container {
            width: 100%;
            max-width: 620px;
            background-color: var(--glass-form);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--p-neon);
            border-radius: 30px; /* Сглаженные края */
            padding: 55px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(160, 32, 240, 0.1);
            animation: formFadeIn 0.8s ease-out;
        }

        @keyframes formFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .form-title {
            text-align: center;
            margin-bottom: 45px;
            letter-spacing: 8px;
            font-size: 26px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .input-group-unit {
            margin-bottom: 35px;
            position: relative;
        }

        .input-group-unit label {
            display: block;
            font-size: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .terminal-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--p-neon);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-bright);
            font-family: 'Courier New', monospace;
            font-size: 16px;
            transition: var(--transition-main);
            outline: none;
        }

        .terminal-input:focus {
            background-color: rgba(25, 0, 50, 0.8);
            box-shadow: 0 0 15px var(--p-glow);
            border-color: #ffffff;
        }

        .terminal-textarea {
            min-height: 180px;
            resize: none;
            line-height: 1.6;
        }

        /* ================================================================
           КНОПКА ОТПРАВКИ И ЭФФЕКТЫ
           ================================================================
        */
        .submission-trigger-area {
            margin-top: 50px;
        }

        .btn-transmit {
            width: 100%;
            background-color: var(--p-neon);
            color: var(--text-bright);
            border: none;
            padding: 20px;
            border-radius: 18px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 10px var(--p-glow);
        }

        .btn-transmit:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px var(--p-glow);
            background-color: #b347ff;
        }

        .btn-transmit:active {
            transform: translateY(2px);
        }

        /* Декоративные уголки */
        .deco-corner {
            position: absolute;
            width: 30px; height: 30px;
            border: 2px solid var(--p-neon);
            pointer-events: none;
        }
        .deco-tl { top: 25px; left: 25px; border-right: none; border-bottom: none; }
        .deco-br { bottom: 25px; right: 25px; border-left: none; border-top: none; }

    </style>
</head>
<body>

    <div class="system-background"></div>

    <header class="header-interface">
        <div class="nav-back-unit">
            <a href="mail.html">← ОТМЕНА_ОПЕРАЦИИ</a>
        </div>
    </header>

    <div class="main-transmission-layout">
        
        <aside class="contacts-module">
            <div class="module-header">
                <h3>КОНТАКТЫ_UUID</h3>
            </div>
            
            <div class="contacts-scroll-area" id="contacts-list-container">
                </div>
        </aside>

        <main class="composition-module">
            
            <div class="glass-form-container">
                <div class="deco-corner deco-tl"></div>
                <div class="deco-corner deco-br"></div>

                <h2 class="form-title">НОВЫЙ ПАКЕТ</h2>

                <form id="secure-transmission-form">
                    
                    <div class="input-group-unit">
                        <label for="dest-uuid">Идентификатор получателя</label>
                        <input type="text" id="dest-uuid" class="terminal-input" placeholder="ВЫБЕРИТЕ ИЗ СПИСКА..." maxlength="10" required>
                    </div>

                    <div class="input-group-unit">
                        <label for="dest-subject">Тема передачи данных</label>
                        <input type="text" id="dest-subject" class="terminal-input" placeholder="SUBJECT_LINE" required>
                    </div>

                    <div class="input-group-unit">
                        <label for="dest-body">Шифрованный блок данных</label>
                        <textarea id="dest-body" class="terminal-input terminal-textarea" placeholder="ВВЕДИТЕ СООБЩЕНИЕ..."></textarea>
                    </div>

                    <div class="submission-trigger-area">
                        <button type="submit" class="btn-transmit" id="submit-btn">ВЫПОЛНИТЬ ПЕРЕДАЧУ</button>
                    </div>

                </form>
            </div>

        </main>
    </div>

    <script>
        /**
         * Список верифицированных сотрудников G.L.O.M.G.
         */
        const employeeDatabase = [
            { name: "MORISREAL", uuid: "1110001110", level: "L6" },
            { name: "SUMBER", uuid: "0101010101", level: "L5" },
            { name: "CORE_ADMIN", uuid: "1111111111", level: "L7" },
            { name: "STAFF_UNIT_01", uuid: "0010111010", level: "L4" },
            { name: "ANALYST_09", uuid: "0001110011", level: "L4" },
            { name: "TECH_SUPPORT", uuid: "0111000111", level: "L3" },
            { name: "GATE_KEEPER", uuid: "0000000001", level: "L2" }
        ];

        const listContainer = document.getElementById('contacts-list-container');
        const uuidInputField = document.getElementById('dest-uuid');
        const transmissionForm = document.getElementById('secure-transmission-form');
        const submitButton = document.getElementById('submit-btn');

        /**
         * Функция генерации списка контактов в левой панели
         */
        function populateContacts() {
            listContainer.innerHTML = '';

            employeeDatabase.forEach(employee => {
                const card = document.createElement('div');
                card.className = 'contact-card';
                
                card.innerHTML = `
                    <span class="username">${employee.name}</span>
                    <span class="user-uuid">UUID: ${employee.uuid}</span>
                    <span class="access-level">${employee.level}</span>
                `;

                // Обработка клика по контакту
                card.addEventListener('click', () => {
                    selectContact(employee.uuid);
                });

                listContainer.appendChild(card);
            });
        }

        /**
         * Автоматическая подстановка UUID в поле ввода
         */
        function selectContact(uuid) {
            uuidInputField.value = uuid;
            
            // Визуальный эффект фокуса
            uuidInputField.focus();
            uuidInputField.style.borderColor = "#ffffff";
            uuidInputField.style.boxShadow = "0 0 25px #a020f0";
            
            setTimeout(() => {
                uuidInputField.style.borderColor = "#a020f0";
                uuidInputField.style.boxShadow = "0 0 15px rgba(160, 32, 240, 0.45)";
            }, 600);
        }

        /**
         * Обработка процесса отправки пакета данных
         */
        transmissionForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // Изменение состояния кнопки (имитация шифрования)
            submitButton.disabled = true;
            submitButton.innerText = "ШИФРОВАНИЕ ПАКЕТА...";
            submitButton.style.backgroundColor = "rgba(160, 32, 240, 0.5)";

            setTimeout(() => {
                submitButton.innerText = "ПЕРЕДАЧА ДАННЫХ...";
                
                setTimeout(() => {
                    submitButton.innerText = "УСПЕШНО ЗАВЕРШЕНО";
                    submitButton.style.backgroundColor = "#22cc22";
                    submitButton.style.boxShadow = "0 0 30px #22cc22";

                    // Перенаправление обратно в почту через секунду
                    setTimeout(() => {
                        window.location.href = 'mail.html';
                    }, 1200);
                }, 1500);
            }, 1000);
        });

        // Инициализация при загрузке
        window.onload = () => {
            populateContacts();
            console.log("Transmission Terminal Initialized...");
        };
    </script>
</body>
</html>
