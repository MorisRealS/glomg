<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>G.L.O.M.G. // DASHBOARD</title>
    <style>
        /* --- [CSS] БАЗОВЫЕ СТИЛИ (КАК У ГОСТЯ) --- */
        body {
            margin: 0; padding: 0;
            background-color: #050505;
            background: radial-gradient(circle, #0a0a0a 0%, #050505 60%, #1a0033 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #e0e0e0; min-height: 100vh;
            overflow-x: hidden;
        }

        /* Фоновая сетка */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(75, 0, 130, 0.15) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(75, 0, 130, 0.15) 1px, transparent 1px);
            background-size: 50px 50px; z-index: -1;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .navbar {
            width: 100%; height: 60px;
            border-bottom: 2px solid #4b0082;
            background: rgba(5, 5, 5, 0.9);
            display: flex; align-items: center; padding: 0 20px;
            position: fixed; top: 0; z-index: 1000;
            box-sizing: border-box; backdrop-filter: blur(10px);
        }

        .btn-menu {
            background: #4b0082; color: white; border: none; padding: 8px 20px;
            cursor: pointer; font-family: inherit; font-size: 12px;
            text-transform: uppercase; font-weight: bold; transition: 0.3s;
        }

        .btn-menu:hover { background: #a64dff; box-shadow: 0 0 10px #a64dff; }

        /* --- [CSS] СЛАЙДБАР (БОКОВОЕ МЕНЮ) --- */
        #sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(8px);
            z-index: 2000; display: none; /* Скрыто по дефолту */
        }

        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: #0a0a0a; border-right: 2px solid #4b0082;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 40px 20px;
            box-sizing: border-box; z-index: 2001;
        }

        .sidebar.active { left: 0; }

        .user-icon-big {
            width: 80px; height: 80px; background: #333;
            border-radius: 50%; margin: 0 auto 30px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #4b0082; color: #666; font-size: 40px;
        }

        .side-btn {
            background: transparent; border: 1px solid #333; color: #ccc;
            padding: 12px; margin-bottom: 10px; cursor: pointer;
            font-family: inherit; text-align: left; transition: 0.3s;
        }

        .side-btn:hover { background: #1a1a1a; border-color: #4b0082; color: #fff; }

        .btn-logout { border-color: #550000; color: #ff4444; margin-top: auto; }
        .btn-logout:hover { background: #880000; color: white; border-color: #ff0000; box-shadow: 0 0 10px #ff0000; }

        /* --- [CSS] ПРОФИЛЬ (ВЫДВИЖНОЙ СНИЗУ) --- */
        #profile-modal {
            position: fixed; bottom: -100%; left: 50%;
            transform: translateX(-50%);
            width: 500px; background: #111;
            border: 2px solid #4b0082; border-radius: 8px 8px 0 0;
            padding: 30px; transition: 0.5s ease;
            z-index: 3000; box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }

        #profile-modal.active { bottom: 20%; border-radius: 8px; }

        .profile-header { display: flex; gap: 20px; align-items: flex-start; }

        .profile-main-info { flex-grow: 1; }

        .profile-nick { color: #a64dff; font-size: 24px; font-weight: bold; margin: 0; }
        .profile-level { color: #00ff00; font-size: 12px; margin-top: 5px; }
        .profile-uuid { color: #555; font-size: 10px; margin-top: 15px; }

        .profile-details { margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; }
        .detail-label { color: #666; font-size: 10px; text-transform: uppercase; }
        .detail-value { color: #ddd; font-size: 14px; margin-bottom: 15px; }

    </style>
</head>
<body>

    <div class="navbar">
        <button class="btn-menu" onclick="toggleSidebar()">MENU</button>
        <span style="margin-left: 20px; font-size: 10px; color: #444;">G.L.O.M.G. // OPERATOR_CABINET</span>
    </div>

    <div id="sidebar-overlay" onclick="closeAll()"></div>

    <div class="sidebar" id="sidebar">
        <div class="user-icon-big">👤</div>
        <button class="side-btn" onclick="openProfile()">MY_PROFILE</button>
        <button class="side-btn">DATABASE_ARCHIVE</button>
        <button class="side-btn">COMMUNICATION_LINK</button>
        
        <button class="side-btn btn-logout" onclick="location.href='/'">LOGOUT</button>
    </div>

    <div id="profile-modal">
        <div class="profile-header">
            <div class="user-icon-big" style="margin:0; width:60px; height:60px; font-size: 30px;">👤</div>
            <div class="profile-main-info">
                <p class="profile-nick" id="p-nick">USER_NAME</p>
                <div class="profile-level">LEVEL: <span id="p-level">0</span></div>
                <div class="profile-uuid">UUID: <span id="p-uuid">0000-0000-0000</span></div>
            </div>
        </div>
        
        <div class="profile-details">
            <div class="detail-label">Отдел</div>
            <div class="detail-value" id="p-dept">Internal Security</div>
            
            <div class="detail-label">Описание</div>
            <div class="detail-value" id="p-desc">Системный оператор группы мониторинга ONG.</div>
        </div>
        
        <button class="btn-menu" style="width: 100%; margin-top: 10px;" onclick="closeAll()">CLOSE</button>
    </div>

    <div style="margin-top: 100px; text-align: center; color: #333;">
        <h1>ACCESS_POINT: DASHBOARD</h1>
        <p>Используйте MENU для доступа к функциям.</p>
    </div>

    <script>
        // База сотрудников
        const operators = {
            "morisreal": { uuid: "7741-09XX-ONG", level: "Admin", dept: "CORE_MANAGEMENT", desc: "Главный архитектор системы G.L.O.M.G." },
            "sumber": { uuid: "3312-88XX-ONG", level: "Senior", dept: "PRISM_OPERATOR", desc: "Оператор организации P.R.I.S.M" },
            "dykzxz": { uuid: "5590-11XX-ONG", level: "Agent", dept: "FIELD_OPERATIONS", desc: "Оперативный сбор данных в секторах 4-9." },
            "msk4ne_": { uuid: "1004-44XX-ONG", level: "Analyst", dept: "DATA_ARCHIVE", desc: "Обработка и расшифровка логов ONG." },
            "shmegh1": { uuid: "9982-22XX-ONG", level: "Operator", dept: "MONITORING", desc: "Круглосуточный мониторинг состояния ядра." }
        };

        // Текущий пользователь (потом сделаем динамически)
        let currentUser = "morisreal"; 

        function toggleSidebar() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('sidebar-overlay').style.display = 'block';
        }

        function closeAll() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('profile-modal').classList.remove('active');
            document.getElementById('sidebar-overlay').style.display = 'none';
        }

        function openProfile() {
            const data = operators[currentUser];
            document.getElementById('p-nick').innerText = currentUser.toUpperCase();
            document.getElementById('p-uuid').innerText = data.uuid;
            document.getElementById('p-level').innerText = data.level;
            document.getElementById('p-dept').innerText = data.dept;
            document.getElementById('p-desc').innerText = data.desc;

            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('profile-modal').classList.add('active');
        }
    </script>
</body>
</html>
