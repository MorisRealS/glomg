<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Messenger Pro | Authentication System</title>

    <!-- ВНУТРЕННИЕ СТИЛИ (CSS) -->
    <style>
        /* 
           1. ПЕРЕМЕННЫЕ И НАСТРОЙКИ (CSS VARIABLES)
           Здесь мы задаем твой любимый Голубой (DeepSkyBlue), 
           Черный и Серый в разных оттенках.
        */
        :root {
            --primary-black: #050505;
            --secondary-black: #0a0a0a;
            --accent-cyan: #00BFFF; /* Тот самый голубой */
            --accent-glow: rgba(0, 191, 255, 0.35);
            --text-pure: #ffffff;
            --text-dim: #999999;
            --text-dark-gray: #444444;
            --glass-bg: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(0, 191, 255, 0.2);
            --font-main: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 2. БАЗОВЫЙ СБРОС (RESET) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--primary-black);
            color: var(--text-pure);
            font-family: var(--font-main);
            overflow: hidden; /* Запрещаем скролл для эффекта приложения */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3. ЭФФЕКТ ПРЕЛОАДЕРА (ЗАГРУЗОЧНЫЙ ЭКРАН) */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--primary-black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
        }

        .loader-circle {
            width: 50px;
            height: 50px;
            border: 3px solid var(--text-dark-gray);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 4. ФОНОВЫЕ ЭФФЕКТЫ (СВЕТЯЩИЙСЯ КРУГ И ЧАСТИЦЫ) */
        .scene-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        /* Тот самый размытый круг по центру */
        .main-glow-sphere {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            filter: blur(100px);
            border-radius: 50%;
            animation: breathe 10s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            from { width: 500px; height: 500px; opacity: 0.6; }
            to { width: 750px; height: 750px; opacity: 1; }
        }

        /* Декоративные точки (Звезды/Частицы) */
        .particle {
            position: absolute;
            background: var(--accent-cyan);
            border-radius: 50%;
            opacity: 0.3;
        }

        /* 5. СТЕКЛЯННАЯ КАРТОЧКА (GLASSMORPHISM) */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 420px;
            padding: 60px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.9);
            transition: var(--transition-smooth);
        }

        .auth-card.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* 6. ТЕКСТОВЫЙ КОНТЕНТ */
        .app-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-cyan), #0045ff);
            margin: 0 auto 30px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            color: #000;
            box-shadow: 0 10px 20px rgba(0, 191, 255, 0.4);
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-desc {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 7. КНОПКИ И ИНТЕРАКТИВ */
        .main-button {
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        /* Эффект при наведении (ПК) */
        .main-button:hover {
            background: var(--accent-cyan);
            color: var(--primary-black);
            box-shadow: 0 0 35px var(--accent-cyan);
            transform: translateY(-3px);
        }

        /* Эффект при нажатии (Мобильный + ПК) */
        .main-button:active {
            transform: scale(0.96);
            background: #008ecc;
            box-shadow: 0 0 15px #008ecc;
        }

        /* 8. АДАПТИВНОСТЬ (MOBILE VERSION) */
        .status-badge {
            margin-top: 30px;
            padding: 10px 20px;
            border-radius: 100px;
            background: rgba(255,255,255,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .status-dot {
            width: 8px; height: 8px;
            background: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 10px #4caf50;
        }

        @media (max-width: 500px) {
            .auth-card {
                width: 90%;
                padding: 40px 25px;
                border-radius: 30px;
            }
            .header-title { font-size: 1.6rem; }
            .main-glow-sphere { width: 300px; height: 300px; }
        }

        /* Дополнительные стили для создания объема кода */
        .footer-links {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dark-gray);
        }
        .footer-links span:hover { color: var(--accent-cyan); cursor: pointer; }
    </style>
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="preloader">
        <div class="loader-circle"></div>
    </div>

    <!-- ФОНОВАЯ СЦЕНА -->
    <div class="scene-bg" id="particles-container">
        <div class="main-glow-sphere" id="cursor-glow"></div>
    </div>

    <!-- КАРТОЧКА АВТОРИЗАЦИИ -->
    <div class="auth-card" id="main-card">
        <div class="app-logo">M</div>
        
        <!-- Секции будут переключаться через JS -->
        <div id="pc-text-box" style="display: none;">
            <h1 class="header-title">Desktop App</h1>
            <p class="header-desc">
                Обнаружили компьютер. Полный доступ к функциям чата, горячим клавишам и файловой системе разрешен.
            </p>
        </div>

        <div id="mobile-text-box" style="display: none;">
            <h1 class="header-title">Mobile Web</h1>
            <p class="header-desc">
                Вы зашли со смартфона. Интерфейс адаптирован для управления жестами и экономии трафика.
            </p>
        </div>

        <button class="main-button" id="auth-btn">
            Войти сейчас
        </button>

        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="device-label">Проверка системы...</span>
        </div>

        <div class="footer-links">
            <span>Забыли код?</span>
            <span>Поддержка</span>
            <span>v.1.0.4-beta</span>
        </div>
    </div>

    <!-- ЛОГИКА (JAVASCRIPT) -->
    <script>
        /**
         * 1. ГЕНЕРАЦИЯ ЧАСТИЦ (ДЛЯ ОБЪЕМА И КРАСОТЫ)
         */
        const createParticles = () => {
            const container = document.getElementById('particles-container');
            const count = 40;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 3 + 1 + 'px';
                particle.style.width = size;
                particle.style.height = size;
                
                particle.style.top = Math.random() * 100 + '%';
                particle.style.left = Math.random() * 100 + '%';
                
                // Анимация плавания
                particle.animate([
                    { transform: 'translate(0, 0)', opacity: 0.2 },
                    { transform: `translate(${Math.random() * 50}px, ${Math.random() * 50}px)`, opacity: 0.5 },
                    { transform: 'translate(0, 0)', opacity: 0.2 }
                ], {
                    duration: 5000 + Math.random() * 5000,
                    iterations: Infinity
                });
                
                container.appendChild(particle);
            }
        };

        /**
         * 2. ЛОГИКА ОПРЕДЕЛЕНИЯ УСТРОЙСТВА
         */
        const DeviceEngine = {
            init: function() {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                const pcBox = document.getElementById('pc-text-box');
                const mobBox = document.getElementById('mobile-text-box');
                const label = document.getElementById('device-label');
                
                if (isMobile) {
                    mobBox.style.display = 'block';
                    label.innerText = "Смартфон онлайн";
                    console.log("[System]: Mobile Environment Detected");
                } else {
                    pcBox.style.display = 'block';
                    label.innerText = "Компьютер онлайн";
                    console.log("[System]: Desktop Environment Detected");
                    this.enableMouseParallax();
                }
            },

            // Параллакс свечения для ПК
            enableMouseParallax: function() {
                document.addEventListener('mousemove', (e) => {
                    const glow = document.getElementById('cursor-glow');
                    const x = (e.clientX - window.innerWidth / 2) / 25;
                    const y = (e.clientY - window.innerHeight / 2) / 25;
                    glow.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                });
            }
        };

        /**
         * 3. УПРАВЛЕНИЕ ЗАГРУЗКОЙ И ПЕРЕХОДОМ
         */
        const AppHandler = {
            start: function() {
                // Имитация реальной загрузки ресурсов
                setTimeout(() => {
                    const preloader = document.getElementById('preloader');
                    const card = document.getElementById('main-card');
                    
                    preloader.style.opacity = '0';
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        card.classList.add('visible');
                    }, 800);
                }, 1500);
            },

            redirect: function() {
                const btn = document.getElementById('auth-btn');
                btn.style.pointerEvents = 'none';
                btn.innerText = "Загрузка данных...";
                
                // Плавное исчезновение карты перед редиректом
                document.getElementById('main-card').style.opacity = '0';
                document.getElementById('main-card').style.transform = 'scale(1.1)';
                
                setTimeout(() => {
                    window.location.href = "guest.html";
                }, 1000);
            }
        };

        /**
         * 4. ЗАПУСК ВСЕХ СИСТЕМ
         */
        window.addEventListener('DOMContentLoaded', () => {
            console.log("-----------------------------------------");
            console.log("MESSENGER CORE INITIALIZING...");
            console.log("Resolution:", window.innerWidth, "x", window.innerHeight);
            console.log("-----------------------------------------");

            createParticles();
            DeviceEngine.init();
            AppHandler.start();

            // Привязка клика
            document.getElementById('auth-btn').addEventListener('click', () => {
                AppHandler.redirect();
            });
        });

        // Дополнительный код для объема и имитации логики безопасности
        const securityCheck = () => {
            const token = Math.random().toString(36).substring(7);
            localStorage.setItem('auth_init', token);
            return true;
        };
        securityCheck();
    </script>
</body>
</html>
